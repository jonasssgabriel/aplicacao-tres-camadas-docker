name: CI-CD Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  ci:
    name: Testar aplicacao
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Validar Docker Compose
        run: docker compose config

      - name: Subir containers
        run: docker compose up -d

      - name: Aguardar inicializacao
        run: sleep 15

      - name: Mostrar containers
        run: docker compose ps

      - name: Testar frontend
        run: curl --fail http://localhost:8080

      - name: Testar API pelo proxy
        run: curl --fail http://localhost:8080/api/

      - name: Testar Redis
        run: docker compose exec -T banco redis-cli ping | grep PONG

      - name: Encerrar containers
        if: always()
        run: docker compose down

  cd:
    name: Publicar imagem Docker
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build e Push da imagem
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}