services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - interna

  api:
    image: traefik/whoami
    networks:
      - interna

  banco:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dados-banco:/data
    networks:
      - interna

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9001:9001"
    volumes:
      - dados-objetos:/data
    networks:
      - interna

networks:
  interna:
    driver: bridge

volumes:
  dados-banco:
  dados-objetos: